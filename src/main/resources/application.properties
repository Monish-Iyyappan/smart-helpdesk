spring.application.name=smart-helpdesk
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_helpdesk}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=5
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}
app.console.enabled=${APP_CONSOLE_ENABLED:false}
